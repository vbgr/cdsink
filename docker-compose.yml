services:

  db:
    image: postgres:16
    command: |
      -c max_connections=100
      -c shared_buffers=3GB
      -c effective_cache_size=8GB
      -c maintenance_work_mem=1GB
      -c work_mem=256MB
      -c log_destination=stderr
      -c log_statement=ddl
      -c logging_collector=on
      -c wal_level=logical
    ports:
    - 40010:5432
    env_file:
    - .env
    volumes:
    - db:/var/lib/postgresql/data
    - ./bin/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh

  s-1:
    image: apicurio/apicurio-registry-sql:2.4.4.Final
    restart: on-failure
    ports:
    - 18000:8080
    env_file:
    - .env

  b-1:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,LOCALHOST://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://b-1:9092,LOCALHOST://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,LOCALHOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@b-1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - 19092:19092
    volumes:
      - b-1:/var/lib/kafka/data

  b-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    hostname: k-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: main
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: b-1:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://s-1:8080/apis/ccompat/v7
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: c-1
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://c-1:8083
    ports:
      - 18001:8080

  c-1:
    image: kafka-connect:7.5.3
    restart: unless-stopped
    build: env/connect
    ports:
      - 8083:8083
    env_file:
      - .env
    environment:
      CONNECT_REST_ADVERTISED_HOST_NAME: c-1
      CONNECT_GROUP_ID: c-1
      CONNECT_CONFIG_STORAGE_TOPIC: _c_1_configs
      CONNECT_OFFSET_STORAGE_TOPIC: _c_1_offset
      CONNECT_STATUS_STORAGE_TOPIC: _c_1_status

  migrate:
    image: goose
    build: env/goose
    working_dir: /migrations
    volumes:
      - ./env/db:/migrations
    env_file:
      - .env
    environment:
      GOOSE_DBSTRING: "user=${POSTGRES_USER} dbname=app host=db password=${POSTGRES_PASSWORD} sslmode=disable"

  randb:
    image: randb:1
    build: env/randb
    restart: on-failure
    env_file:
      - .env

volumes:
  db: {}
  b-1: {}
