[package]
name = "avroarrow"
version = "0.1.0"
edition = "2024"

[dependencies]
apache-avro = { version = "0.21.0", features = ["derive"] }
arrow = "57.1.0"
chrono = "0.4.42"
num-bigint = "0.4.6"
num-traits = { version = "0.2.19", features = ["i128"] }
thiserror = "2.0.17"

[dev-dependencies]
arrow-json = "57.1.0"
criterion = { version = "0.8.1", features = ["html_reports"] }
fake = { version = "4.4.0", features = ["chrono", "http", "ulid", "uuid", "derive"] }
maplit = "1.0.2"
pretty_assertions = "1.4.1"
rand = "0.9.2"
serde = "1.0.228"
serde_derive = "1.0.228"
serde_json = "1.0.147"
uuid = "1.19.0"

[[bench]]
name = "bench_main"
harness = false
